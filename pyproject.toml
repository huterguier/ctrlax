[project]
name = "ctrlax"
version = "0.1.0"
description = "Control algorithms in JAX."
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "jax>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrlax"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
]
