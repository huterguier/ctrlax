[project]
name = "ctrlax"
version = "0.1.0"
description = "Control algorithms in JAX."
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "jax>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrlax"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "ruff",
]
